<div class="notebook">
  <div class="notebook-toolbar">
    <span class="text-muted" style="font-size:0.75rem">
      Notas livres (markdown) — a IA lê isto como contexto qualitativo ao analisar este time.
    </span>
    <span class="save-status" [class.is-saving]="status === 'saving'">
      <ng-container [ngSwitch]="status">
        <span *ngSwitchCase="'saving'">salvando…</span>
        <span *ngSwitchCase="'saved'">salvo</span>
      </ng-container>
    </span>
  </div>
  <div class="notebook-editor" #editorHost></div>
</div>
