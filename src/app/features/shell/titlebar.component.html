<div class="titlebar">
  <div class="titlebar-drag" (dblclick)="toggleMaximize()">
    <span class="titlebar-brand">CS Demo Analyst</span>
  </div>

  <div class="titlebar-controls">
    <button class="titlebar-btn" title="Minimizar" (click)="minimize()">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <rect x="1" y="5.5" width="10" height="1" fill="currentColor" />
      </svg>
    </button>

    <button class="titlebar-btn" title="Maximizar" (click)="toggleMaximize()">
      <svg *ngIf="!isMaximized" viewBox="0 0 12 12" width="10" height="10">
        <rect x="1" y="1" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
      </svg>
      <svg *ngIf="isMaximized" viewBox="0 0 12 12" width="11" height="11">
        <rect x="1" y="3" width="7.5" height="7.5" fill="none" stroke="currentColor" stroke-width="1" />
        <path d="M3 3V1h7.5v7.5H9" fill="none" stroke="currentColor" stroke-width="1" />
      </svg>
    </button>

    <button class="titlebar-btn titlebar-close" title="Fechar" (click)="close()">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.3" />
      </svg>
    </button>
  </div>
</div>
